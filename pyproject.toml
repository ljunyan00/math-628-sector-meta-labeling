[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-meta-labeling"
version = "0.1.0"
description = "Math 628: regime-aware meta-labeling for sector ETF momentum"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "yfinance>=0.2.54", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
models = ["scikit-learn>=1.5", "xgboost>=2.1", "statsmodels>=0.14"]

[project.scripts]
sector-research = "sector_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
